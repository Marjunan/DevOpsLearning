name: CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  # -----------------------------
  # CI: Build, Test, Publish
  # -----------------------------
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release

      - name: Publish API
        run: |
          dotnet publish ./src/ProductApi/ProductApi.csproj \
            --configuration Release \
            --no-build \
            --output ./publish

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: product-api
          path: ./publish

  # -----------------------------
  # CD: Deploy to Azure
  # -----------------------------
  deploy:
    needs: build-and-test

    # Deploy ONLY after a push to main.
    # PRs and feature branch pushes stop after CI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: product-api
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: devopslearning-product-api
          package: ./publish

      - name: Health Check
        run: |
          sleep 20
          curl --fail https://devopslearning-product-api-cff4a9ckezbrcrgu.westus3-01.azurewebsites.net/api/products
